name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Style du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  tests:
    name: Tests unitaires (pytest, avec Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # PySpark a besoin de Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dbt:
    name: Modèles et tests dbt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: .
      POSTGRES_HOST: localhost
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
    defaults:
      run:
        working-directory: dbt/fraudflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../requirements.txt
      - run: dbt deps
      # Les seeds remplacent le data lake : un petit jeu de données écrit à la main
      - run: dbt seed
      - run: dbt build --exclude "resource_type:seed"

  docker:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile tools build
