[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Erreurs, style, imports triés, pièges courants, syntaxe Python moderne
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "dirty_data", "fraud_patterns", "producer", "referential", "transactions", "jobs", "lib",
]

[tool.pytest.ini_options]
pythonpath = ["generator", "spark"]
testpaths = ["generator/tests", "spark/tests"]
