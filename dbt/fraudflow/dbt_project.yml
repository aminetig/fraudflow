name: fraudflow
version: "1.0.0"
profile: fraudflow

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  fraudflow:
    # staging : renommage et typage des sources, une vue par table
    staging:
      +schema: staging
      +materialized: view
    # intermediate : jointures et calculs réutilisés par plusieurs marts
    intermediate:
      +schema: intermediate
      +materialized: view
    # marts : tables prêtes pour le métier et les tableaux de bord
    marts:
      +schema: marts
      +materialized: table

seeds:
  fraudflow:
    # Petit jeu de données qui remplace le data lake dans la CI : jamais en dev ou en production
    +enabled: "{{ target.name == 'ci' }}"
    raw:
      +schema: raw
    ref:
      +schema: ref
